name: scheduled-dep-check
on:
  schedule:
    - cron: "57 6 * * *"       # daily 06:57 UTC
  workflow_dispatch: {}

concurrency:
  group: scheduled-dep-check
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/_checks.yml
    secrets: inherit

  report-failure:
    needs: checks
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    uses: modern-python/.github/.github/workflows/report-scheduled-failure.yml@main
